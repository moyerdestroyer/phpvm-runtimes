# Build dynamic macOS Apple Silicon runtime tarballs.
#
# Linux dynamic runtime tarballs are normally built locally with
# scripts/build-dynamic-runtime-local.sh and then combined with these artifacts
# before preparing a catalog.
name: build-apple-dynamic

on:
  workflow_dispatch:
    inputs:
      php_version:
        description: PHP version to build, or all supported versions
        required: true
        default: all
        type: choice
        options:
          - all
          - 8.1.34
          - 8.2.31
          - 8.3.31
          - 8.4.22

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        php_version: ${{ fromJSON(inputs.php_version == 'all' && '["8.1.34","8.2.31","8.3.31","8.4.22"]' || format('["{0}"]', inputs.php_version)) }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify Apple Silicon runner
        run: |
          uname -a
          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "error: expected arm64 runner for aarch64-apple-darwin" >&2
            exit 1
          fi

      - name: Install macOS dynamic build dependencies
        run: |
          brew update
          brew install \
            autoconf \
            bison \
            curl \
            freetype \
            icu4c \
            jpeg-turbo \
            jq \
            libiconv \
            libpng \
            libxml2 \
            libzip \
            oniguruma \
            openssl@3 \
            pkg-config \
            re2c \
            sqlite \
            webp \
            zlib

          echo "$(brew --prefix bison)/bin" >> "${GITHUB_PATH}"
          echo "$(brew --prefix curl)/bin" >> "${GITHUB_PATH}"

          pkg_config_path=""
          for formula in \
            openssl@3 \
            zlib \
            curl \
            sqlite \
            icu4c \
            oniguruma \
            libiconv \
            libzip \
            libpng \
            jpeg-turbo \
            webp \
            freetype \
            libxml2
          do
            prefix="$(brew --prefix "${formula}")"
            for dir in "${prefix}/lib/pkgconfig" "${prefix}/share/pkgconfig"; do
              if [[ -d "${dir}" ]]; then
                if [[ -n "${pkg_config_path}" ]]; then
                  pkg_config_path="${pkg_config_path}:${dir}"
                else
                  pkg_config_path="${dir}"
                fi
              fi
            done
          done

          {
            echo "PKG_CONFIG_PATH=${pkg_config_path}"
            echo "PHPVM_BUILD_JOBS=$(sysctl -n hw.ncpu)"
          } >> "${GITHUB_ENV}"

      - name: Build dynamic Apple runtime
        run: |
          scripts/build-dynamic-runtime-local.sh \
            "${{ matrix.php_version }}" \
            aarch64-apple-darwin \
            dist

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-${{ matrix.php_version }}-aarch64-apple-darwin
          path: |
            dist/php-${{ matrix.php_version }}-aarch64-apple-darwin.tar.gz
            dist/php-${{ matrix.php_version }}-aarch64-apple-darwin.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  collect:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Apple runtime artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List Apple artifacts
        run: |
          ls -lh dist
          for f in dist/php-*-aarch64-apple-darwin.tar.gz; do
            printf '%s  ' "${f}"
            cat "${f}.sha256"
          done

      - name: Upload combined Apple artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apple-dynamic-tarballs
          path: dist/php-*-aarch64-apple-darwin.tar.gz*
          if-no-files-found: error
          retention-days: 30
