# Reusable job: build, package, and verify one *static* runtime tarball (SPC for both Linux and macOS).
on:
  workflow_call:
    inputs:
      php_version:
        required: true
        type: string
      target:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: >-
      ${{
        inputs.target == 'x86_64-unknown-linux-gnu' && 'ubuntu-22.04' ||
        inputs.target == 'aarch64-apple-darwin' && 'macos-14' ||
        'ubuntu-22.04'
      }}

    steps:
      - uses: actions/checkout@v4

      - name: Select target settings
        run: |
          case "${{ inputs.target }}" in
            x86_64-unknown-linux-gnu)
              echo "SPC_ASSET=spc-linux-x86_64" >> "${GITHUB_ENV}"
              ;;
            aarch64-apple-darwin)
              echo "SPC_ASSET=spc-macos-aarch64" >> "${GITHUB_ENV}"
              ;;
            *)
              echo "error: unsupported target: ${{ inputs.target }}" >&2
              exit 1
              ;;
          esac

      - name: Install Linux build dependencies
        if: inputs.target == 'x86_64-unknown-linux-gnu'
        run: scripts/setup-linux-build-deps.sh

      - name: Install macOS build dependencies
        if: inputs.target == 'aarch64-apple-darwin'
        run: |
          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "error: expected arm64 runner for aarch64-apple-darwin" >&2
            exit 1
          fi

          brew update
          brew install \
            autoconf \
            automake \
            bison \
            cmake \
            curl \
            jq \
            libtool \
            pkg-config \
            re2c

          echo "$(brew --prefix bison)/bin" >> "${GITHUB_PATH}"
          echo "$(brew --prefix curl)/bin" >> "${GITHUB_PATH}"

          echo "MACOSX_DEPLOYMENT_TARGET=12.0" >> "${GITHUB_ENV}"
          echo "PHPVM_BUILD_JOBS=$(sysctl -n hw.ncpu)" >> "${GITHUB_ENV}"

      - name: Cache SPC binary
        id: cache-spc
        uses: actions/cache@v4
        with:
          path: spc
          key: spc-${{ env.SPC_ASSET }}-${{ hashFiles('builds/common/spc-pin.json') }}

      - name: Download pinned StaticPHP (spc)
        if: steps.cache-spc.outputs.cache-hit != 'true'
        run: scripts/download-spc.sh "${SPC_ASSET}" "${{ github.workspace }}/spc"

      - name: Cache SPC sources and downloads
        id: cache-spc-src
        uses: actions/cache@v4
        with:
          path: |
            builds/${{ inputs.php_version }}/source
            builds/${{ inputs.php_version }}/downloads
          key: spc-src-${{ inputs.php_version }}-${{ inputs.target }}-${{ hashFiles('builds/common/extensions.json') }}
          restore-keys: |
            spc-src-${{ inputs.php_version }}-${{ inputs.target }}-

      - name: Build static PHP
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPC_BIN: ${{ github.workspace }}/spc
          CRAFT_DIR: ${{ github.workspace }}/builds/${{ inputs.php_version }}
          EXPECTED_PHP: ${{ inputs.php_version }}
        run: scripts/build-static-php.sh

      - name: Stage runtime tree
        run: |
          STAGING="${RUNNER_TEMP}/runtime-staging"
          mkdir -p "${STAGING}/bin"
          cp "builds/${{ inputs.php_version }}/buildroot/bin/php" "${STAGING}/bin/php"
          scripts/install-composer.sh "${STAGING}"

      - name: Package tarball
        run: |
          mkdir -p dist
          scripts/package-runtime.sh \
            "${RUNNER_TEMP}/runtime-staging" \
            "${{ inputs.php_version }}" \
            "${{ inputs.target }}" \
            dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-${{ inputs.php_version }}-${{ inputs.target }}
          path: |
            dist/php-*.tar.gz
            dist/php-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
