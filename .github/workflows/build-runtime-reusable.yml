# Reusable job: build, package, and verify one runtime tarball.
on:
  workflow_call:
    inputs:
      php_version:
        required: true
        type: string
      target:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: >-
      ${{
        inputs.target == 'x86_64-unknown-linux-gnu' && 'ubuntu-22.04' ||
        inputs.target == 'aarch64-apple-darwin' && 'macos-26' ||
        'ubuntu-22.04'
      }}

    steps:
      - uses: actions/checkout@v4

      - name: Select target settings
        run: |
          case "${{ inputs.target }}" in
            x86_64-unknown-linux-gnu)
              echo "SPC_ASSET=spc-linux-x86_64" >> "${GITHUB_ENV}"
              ;;
            aarch64-apple-darwin)
              echo "BUILD_MODE=dynamic" >> "${GITHUB_ENV}"
              ;;
            *)
              echo "error: unsupported target: ${{ inputs.target }}" >&2
              exit 1
              ;;
          esac

      - name: Install Linux build dependencies
        if: inputs.target == 'x86_64-unknown-linux-gnu'
        run: scripts/setup-linux-build-deps.sh

      - name: Install macOS build dependencies
        if: inputs.target == 'aarch64-apple-darwin'
        run: |
          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "error: expected arm64 runner for aarch64-apple-darwin" >&2
            exit 1
          fi

          brew update
          brew install \
            autoconf \
            bison \
            curl \
            freetype \
            icu4c \
            jpeg-turbo \
            jq \
            libiconv \
            libpng \
            libxml2 \
            libzip \
            oniguruma \
            openssl@3 \
            pkg-config \
            re2c \
            sqlite \
            webp \
            zlib

          echo "$(brew --prefix bison)/bin" >> "${GITHUB_PATH}"
          echo "$(brew --prefix curl)/bin" >> "${GITHUB_PATH}"

          pkg_config_path=""
          for formula in \
            openssl@3 \
            zlib \
            curl \
            sqlite \
            icu4c \
            oniguruma \
            libzip \
            libiconv \
            libpng \
            jpeg-turbo \
            webp \
            freetype \
            libxml2
          do
            prefix="$(brew --prefix "${formula}")"
            for dir in "${prefix}/lib/pkgconfig" "${prefix}/share/pkgconfig"; do
              if [[ -d "${dir}" ]]; then
                if [[ -n "${pkg_config_path}" ]]; then
                  pkg_config_path="${pkg_config_path}:${dir}"
                else
                  pkg_config_path="${dir}"
                fi
              fi
            done
          done

          {
            echo "PKG_CONFIG_PATH=${pkg_config_path}"
            echo "PHPVM_BUILD_JOBS=$(sysctl -n hw.ncpu)"
          } >> "${GITHUB_ENV}"

      - name: Download pinned StaticPHP (spc)
        if: inputs.target == 'x86_64-unknown-linux-gnu'
        run: scripts/download-spc.sh "${SPC_ASSET}" "${{ github.workspace }}/spc"

      - name: Build static PHP
        if: inputs.target == 'x86_64-unknown-linux-gnu'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPC_BIN: ${{ github.workspace }}/spc
          CRAFT_DIR: ${{ github.workspace }}/builds/${{ inputs.php_version }}
          EXPECTED_PHP: ${{ inputs.php_version }}
        run: scripts/build-static-php.sh

      - name: Stage runtime tree
        if: inputs.target == 'x86_64-unknown-linux-gnu'
        run: |
          STAGING="${RUNNER_TEMP}/runtime-staging"
          mkdir -p "${STAGING}/bin"
          cp "builds/${{ inputs.php_version }}/buildroot/bin/php" "${STAGING}/bin/php"
          scripts/install-composer.sh "${STAGING}"

      - name: Build dynamic Apple runtime
        if: inputs.target == 'aarch64-apple-darwin'
        run: |
          scripts/build-dynamic-runtime-local.sh \
            "${{ inputs.php_version }}" \
            "${{ inputs.target }}" \
            dist

      - name: Package tarball
        if: inputs.target == 'x86_64-unknown-linux-gnu'
        run: |
          mkdir -p dist
          scripts/package-runtime.sh \
            "${RUNNER_TEMP}/runtime-staging" \
            "${{ inputs.php_version }}" \
            "${{ inputs.target }}" \
            dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-${{ inputs.php_version }}-${{ inputs.target }}
          path: |
            dist/php-*.tar.gz
            dist/php-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
