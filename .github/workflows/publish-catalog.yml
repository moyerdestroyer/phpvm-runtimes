# Create a catalog GitHub Release from built runtime artifacts.
#
# Prerequisite: download all 8 build-runtime artifacts into dist/ (or use
# workflow_call from a future orchestrator). This workflow validates the
# manifest and publishes the catalog GitHub Release.
name: publish-catalog

on:
  workflow_dispatch:
    inputs:
      catalog_tag:
        description: Release tag (e.g. catalog-2026-06-13)
        required: true
        type: string
      strict_manifest:
        description: Require non-placeholder manifest (must be updated first)
        required: true
        type: boolean
        default: true
      artifact_run_id:
        description: Optional build-catalog run ID to download tarballs from
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: publish-catalog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Verify manifest
        env:
          STRICT_MANIFEST: ${{ inputs.strict_manifest }}
        run: |
          if [[ "${STRICT_MANIFEST}" == "true" ]]; then
            scripts/verify-manifest.sh --strict manifest.json
          else
            scripts/verify-manifest.sh manifest.json
          fi

      - name: Assert release tag matches manifest
        if: inputs.strict_manifest == true
        env:
          INPUT_CATALOG_TAG: ${{ inputs.catalog_tag }}
        run: |
          MANIFEST_TAG="$(jq -r '.catalog_tag // empty' manifest.json)"
          if [[ "${MANIFEST_TAG}" != "${INPUT_CATALOG_TAG}" ]]; then
            echo "error: workflow catalog_tag (${INPUT_CATALOG_TAG}) != manifest catalog_tag (${MANIFEST_TAG})" >&2
            exit 1
          fi

      - name: Download catalog artifacts from build run
        if: inputs.artifact_run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.artifact_run_id }}
          path: dist
          merge-multiple: true

      - name: Download current-run artifacts (optional)
        if: inputs.artifact_run_id == ''
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: dist
          merge-multiple: true

      - name: Verify catalog tarballs
        env:
          STRICT_MANIFEST: ${{ inputs.strict_manifest }}
        run: |
          if [[ -d dist && "$(find dist -maxdepth 1 -name 'php-*.tar.gz' -type f | wc -l)" -gt 0 ]]; then
            if [[ "${STRICT_MANIFEST}" == "true" ]]; then
              scripts/verify-manifest-assets.sh dist manifest.json
            else
              scripts/verify-catalog-assets.sh dist manifest.json
            fi
          elif [[ "${STRICT_MANIFEST}" == "true" ]]; then
            echo "error: strict publish requires all catalog tarballs in dist/" >&2
            echo "provide artifact_run_id from a build-catalog run, or publish with strict_manifest=false" >&2
            exit 1
          else
            echo "warning: no dist/php-*.tar.gz - attach tarballs manually before publishing"
          fi

      - name: List staged assets
        run: |
          echo "manifest.json"
          ls -la dist/ 2>/dev/null || echo "(no dist/ artifacts — upload tarballs manually to release)"

      - name: Publish catalog release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.catalog_tag }}
          name: ${{ inputs.catalog_tag }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            manifest.json
            dist/php-*.tar.gz
            dist/php-*.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        env:
          INPUT_CATALOG_TAG: ${{ inputs.catalog_tag }}
        run: |
          echo "Published GitHub Release ${INPUT_CATALOG_TAG}."
          echo "Consumers read the catalog from:"
          echo "  https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/master/manifest.json"
          echo "Ensure that file's catalog_tag and artifact URLs match this release."
