# Create a catalog GitHub Release from built runtime artifacts.
#
# Prerequisite: download all 8 build-runtime artifacts into dist/ (or use
# workflow_call from a future orchestrator). This workflow validates manifest
# and publishes a draft release.
name: publish-catalog

on:
  workflow_dispatch:
    inputs:
      catalog_tag:
        description: Release tag (e.g. catalog-2026-06-13)
        required: true
        type: string
      strict_manifest:
        description: Require non-placeholder manifest (must be updated first)
        required: true
        type: boolean
        default: true
      artifact_run_id:
        description: Optional build-catalog run ID to download tarballs from
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Verify manifest
        run: |
          if [[ "${{ inputs.strict_manifest }}" == "true" ]]; then
            scripts/verify-manifest.sh --strict manifest.json
          else
            scripts/verify-manifest.sh manifest.json
          fi

      - name: Assert release tag matches manifest
        if: inputs.strict_manifest == true
        run: |
          MANIFEST_TAG="$(jq -r '.catalog_tag // empty' manifest.json)"
          if [[ "${MANIFEST_TAG}" != "${{ inputs.catalog_tag }}" ]]; then
            echo "error: workflow catalog_tag (${{ inputs.catalog_tag }}) != manifest catalog_tag (${MANIFEST_TAG})" >&2
            exit 1
          fi

      - name: Download catalog artifacts from build run
        if: inputs.artifact_run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.artifact_run_id }}
          path: dist
          merge-multiple: true

      - name: Download current-run artifacts (optional)
        if: inputs.artifact_run_id == ''
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: dist
          merge-multiple: true

      - name: Verify catalog tarballs
        run: |
          if [[ -d dist && "$(ls -A dist/php-*.tar.gz 2>/dev/null | wc -l)" -gt 0 ]]; then
            if [[ "${{ inputs.strict_manifest }}" == "true" ]]; then
              scripts/verify-manifest-assets.sh dist manifest.json
            else
              scripts/verify-catalog-assets.sh dist manifest.json
            fi
          elif [[ "${{ inputs.strict_manifest }}" == "true" ]]; then
            echo "error: strict publish requires all catalog tarballs in dist/" >&2
            echo "provide artifact_run_id from a build-catalog run, or publish with strict_manifest=false" >&2
            exit 1
          else
            echo "warning: no dist/php-*.tar.gz - attach tarballs manually before publishing"
          fi

      - name: List staged assets
        run: |
          echo "manifest.json"
          ls -la dist/ 2>/dev/null || echo "(no dist/ artifacts — upload tarballs manually to release)"

      - name: Create draft catalog release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.catalog_tag }}
          name: ${{ inputs.catalog_tag }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            manifest.json
            dist/php-*.tar.gz
            dist/php-*.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "Draft release created for ${{ inputs.catalog_tag }}."
          echo "Review assets, then publish the draft on GitHub."
          echo "Ensure manifest.json is already on the default branch before publishing the draft — consumers read:"
          echo "  https://raw.githubusercontent.com/${{ github.repository }}/master/manifest.json"
