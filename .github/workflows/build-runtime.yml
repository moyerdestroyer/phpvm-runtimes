# Build one PHP runtime tarball (manual dispatch).
#
# Matrix: pick PHP version + target triple. Uploads artifact for manifest update.
name: build-runtime

on:
  workflow_dispatch:
    inputs:
      php_version:
        description: Exact PHP patch version
        required: true
        type: choice
        options:
          - 8.1.34
          - 8.2.31
          - 8.3.31
          - 8.4.22
      target:
        description: Target triple
        required: true
        type: choice
        options:
          - x86_64-unknown-linux-gnu
          - aarch64-apple-darwin

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-runtime-reusable.yml
    with:
      php_version: ${{ inputs.php_version }}
      target: ${{ inputs.target }}
