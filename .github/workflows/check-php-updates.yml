# Weekly check for PHP catalog changes. Opens or updates an issue when
# manifest.json differs from the planned latest supported catalog.
name: check-php-updates

on:
  schedule:
    # Mondays 14:00 UTC
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Check for PHP updates
        id: check
        run: |
          set -euo pipefail
          OUTPUT="$(scripts/check-php-updates.sh manifest.json 2>/dev/null || true)"
          {
            echo "output<<EOF"
            echo "${OUTPUT}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

          if echo "${OUTPUT}" | grep -Eq '^(UPDATE|ADD|REMOVE)'; then
            echo "has_updates=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_updates=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Open or update issue
        if: steps.check.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TITLE="PHP catalog updates available"
          EXISTING="$(gh issue list --state open --search "${TITLE} in:title" --json number --limit 1 -q '.[0].number // empty')"

          BODY="$(cat <<'ISSUE_EOF'
          ## PHP catalog updates available

          The following catalog changes are available from php.net:

          ```
          UPDATES_HERE
          ```

          ### Rotation steps

          The `auto-catalog-rotation.yml` workflow can build the planned catalog,
          open the manifest/recipe PR, and create a draft release automatically.

          See [AGENTS.md](../blob/master/AGENTS.md) for the full checklist.
          ISSUE_EOF
          )"

          # Inject actual update lines
          UPDATES="$(echo "${{ steps.check.outputs.output }}" | grep -E '^(UPDATE|ADD|REMOVE)')"
          BODY="${BODY/UPDATES_HERE/${UPDATES}}"
          BODY_FILE="$(mktemp)"
          printf '%s\n' "${BODY}" > "${BODY_FILE}"

          if [[ -n "${EXISTING}" ]]; then
            gh issue edit "${EXISTING}" --title "${TITLE}" --body-file "${BODY_FILE}"
            echo "Updated existing issue #${EXISTING}"
          else
            gh label create "php-update" \
              --description "PHP runtime catalog update available" \
              --color "0e8a16" 2>/dev/null || true
            CREATED="$(gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/issues" \
              -f title="${TITLE}" \
              -F body=@"${BODY_FILE}" \
              -F "labels[]=php-update" \
              -q '.number')"
            echo "Created new issue #${CREATED}"
          fi

      - name: Close resolved issue
        if: steps.check.outputs.has_updates == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TITLE="PHP catalog updates available"
          EXISTING="$(gh issue list --state open --search "${TITLE} in:title" --json number --limit 1 -q '.[0].number // empty')"
          if [[ -n "${EXISTING}" ]]; then
            gh issue close "${EXISTING}" --comment "All PHP versions are current. Closing."
            echo "Closed issue #${EXISTING}"
          else
            echo "No open update issue to close"
          fi
