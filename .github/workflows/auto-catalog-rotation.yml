# Detect PHP releases, build only the changed runtimes, publish the GitHub
# Release, and merge the manifest/recipe PR.
#
# Unchanged tarballs are reused from the previous catalog release, so a single
# patch release costs 2 builds (1 PHP version x 2 targets) instead of 8.
# php.net downgrades for already-shipped lines are ignored by the planner
# (the per-minor releases API has served stale data before, e.g. 2026-09-05).
name: auto-catalog-rotation

on:
  schedule:
    # Every 2 days at 14:00 UTC (1st, 3rd, 5th, ...)
    - cron: "0 14 */2 * *"
  workflow_dispatch:
    inputs:
      catalog_tag:
        description: Optional release tag (default catalog-YYYY-MM-DD)
        required: false
        type: string
        default: ""
      force:
        description: Rebuild everything even when no PHP update is detected
        required: false
        type: boolean
        default: false
      dry_run:
        description: Build and verify without pushing a PR or publishing a release
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: auto-catalog-rotation
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      catalog_tag: ${{ steps.plan.outputs.catalog_tag }}
      has_update: ${{ steps.plan.outputs.has_update }}
      has_builds: ${{ steps.plan.outputs.has_builds }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Plan catalog rotation
        id: plan
        env:
          INPUT_CATALOG_TAG: ${{ github.event.inputs.catalog_tag }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail

          CATALOG_TAG="${INPUT_CATALOG_TAG}"
          if [[ -z "${CATALOG_TAG}" ]]; then
            CATALOG_TAG="catalog-$(date -u +%F)"
          fi

          scripts/plan-catalog-update.py > plan.json
          cat plan.json

          if [[ "${INPUT_FORCE}" == "true" ]]; then
            MATRIX="$(jq -c '.matrix' plan.json)"
          else
            MATRIX="$(jq -c '.build_matrix' plan.json)"
          fi

          HAS_BUILDS="false"
          if [[ "$(jq -r '.include | length' <<<"${MATRIX}")" != "0" ]]; then
            HAS_BUILDS="true"
          fi

          {
            echo "catalog_tag=${CATALOG_TAG}"
            echo "has_update=$(jq -r '.has_update' plan.json)"
            echo "has_builds=${HAS_BUILDS}"
            echo "matrix=${MATRIX}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload catalog plan
        uses: actions/upload-artifact@v4
        with:
          name: catalog-plan
          path: plan.json
          if-no-files-found: error
          retention-days: 30

  build:
    needs: plan
    if: >-
      (needs.plan.outputs.has_update == 'true' || github.event.inputs.force == 'true') &&
      needs.plan.outputs.has_builds == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/build-runtime-reusable.yml
    with:
      php_version: ${{ matrix.php_version }}
      target: ${{ matrix.target }}

  prepare:
    needs:
      - plan
      - build
    # Runs even when the build job was skipped (manifest-only changes such as
    # a dropped minor line reuse every tarball), but never after a failure.
    if: >-
      !failure() && !cancelled() &&
      (needs.plan.outputs.has_update == 'true' || github.event.inputs.force == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Download runtime artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: php-*
          path: dist
          merge-multiple: true

      - name: Download catalog plan
        uses: actions/download-artifact@v4
        with:
          name: catalog-plan
          path: .

      - name: Reuse unchanged tarballs from previous release
        if: github.event.inputs.force != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          UNCHANGED="$(jq -r '.unchanged | length' plan.json)"
          PREV_TAG="$(jq -r '.catalog_tag // empty' manifest.json)"
          mkdir -p prev-dist

          if [[ "${UNCHANGED}" -eq 0 || -z "${PREV_TAG}" ]]; then
            echo "nothing to reuse (unchanged=${UNCHANGED}, previous tag: ${PREV_TAG:-none})"
            exit 0
          fi

          echo "reusing ${UNCHANGED} unchanged runtime(s) from ${PREV_TAG}"
          gh release download "${PREV_TAG}" --dir prev-dist \
            --pattern 'php-*.tar.gz' \
            --pattern 'php-*.tar.gz.sha256'

      - name: Apply plan and prepare manifest
        env:
          CATALOG_TAG: ${{ needs.plan.outputs.catalog_tag }}
        run: |
          set -euo pipefail
          python3 scripts/apply-catalog-plan.py \
            --plan plan.json \
            --github-repo "${GITHUB_REPOSITORY}"
          scripts/sync-runtime-recipes.sh --plan plan.json
          REUSE_ARGS=()
          [[ -d prev-dist ]] && REUSE_ARGS=(--reuse-dir prev-dist)
          scripts/prepare-catalog.sh \
            --catalog-tag "${CATALOG_TAG}" \
            --github-repo "${GITHUB_REPOSITORY}" \
            "${REUSE_ARGS[@]}"

      - name: Upload prepared catalog
        uses: actions/upload-artifact@v4
        with:
          name: prepared-catalog
          path: |
            plan.json
            manifest.json
            dist/php-*.tar.gz
            dist/php-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Push catalog branch
        if: github.event.inputs.dry_run != 'true'
        env:
          CATALOG_TAG: ${{ needs.plan.outputs.catalog_tag }}
        run: |
          set -euo pipefail

          BRANCH="automation/${CATALOG_TAG}"
          TITLE="Update phpvm runtime catalog ${CATALOG_TAG}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${BRANCH}:refs/remotes/origin/${BRANCH}" || true
          git checkout -B "${BRANCH}"
          git add manifest.json builds

          if git diff --cached --quiet; then
            echo "No manifest or recipe changes to commit"
          else
            git commit -m "${TITLE}"
            git push --force-with-lease origin "HEAD:${BRANCH}"
          fi

      - name: Open or update catalog PR
        id: pr
        if: github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.PHPVM_AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          CATALOG_TAG: ${{ needs.plan.outputs.catalog_tag }}
        run: |
          set -euo pipefail

          BRANCH="automation/${CATALOG_TAG}"
          TITLE="Update phpvm runtime catalog ${CATALOG_TAG}"

          BODY="$(mktemp)"
          {
            echo "Automated catalog rotation for \`${CATALOG_TAG}\`."
            echo
            echo "Desired versions:"
            jq -r '.desired_versions[] | "- `" + . + "`"' plan.json
            echo
            echo "Updated lines:"
            jq -r '
              if (.updated | length) == 0 then
                "- none"
              else
                .updated[] | "- `" + .from + "` -> `" + .to + "`"
              end
            ' plan.json
            echo
            echo "Added:"
            jq -r 'if (.added | length) == 0 then "- none" else .added[] | "- `" + . + "`" end' plan.json
            echo
            echo "Removed:"
            jq -r 'if (.removed | length) == 0 then "- none" else .removed[] | "- `" + . + "`" end' plan.json
            echo
            echo "Rebuilt:"
            jq -r 'if (.build_versions | length) == 0 then "- none (all tarballs reused from the previous catalog release)" else .build_versions[] | "- `" + . + "`" end' plan.json
            echo
            if [[ "$(jq -r '.ignored_downgrades | length' plan.json)" != "0" ]]; then
              echo "Ignored php.net downgrades:"
              jq -r '.ignored_downgrades[] | "- `" + .minor + "`: kept `" + .shipped + "` (php.net suggested `" + .planned + "`)"' plan.json
              echo
            fi
            echo "The workflow verified strict manifest/assets checks. Unchanged tarballs keep"
            echo "their previous checksums and are re-attached from the prior catalog release."
            echo
            echo "GitHub Release \`${CATALOG_TAG}\` is published before this PR is merged, so phpvm never sees unpublished \`/releases/download\` URLs."
          } > "${BODY}"

          EXISTING="$(gh pr list --state open --head "${BRANCH}" --json number --limit 1 -q '.[0].number // empty')"
          if [[ -n "${EXISTING}" ]]; then
            gh pr edit "${EXISTING}" --title "${TITLE}" --body-file "${BODY}"
            PR_NUMBER="${EXISTING}"
            echo "Updated PR #${PR_NUMBER}"
          else
            PR_URL="$(gh pr create \
              --title "${TITLE}" \
              --body-file "${BODY}" \
              --head "${BRANCH}" \
              --base "${{ github.event.repository.default_branch }}")"
            PR_NUMBER="${PR_URL##*/}"
            echo "Created PR #${PR_NUMBER}"
          fi
          echo "pr_number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"

      - name: Publish catalog release
        if: github.event.inputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.catalog_tag }}
          name: ${{ needs.plan.outputs.catalog_tag }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            manifest.json
            dist/php-*.tar.gz
            dist/php-*.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge catalog PR
        if: github.event.inputs.dry_run != 'true' && steps.pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.PHPVM_AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Publish the GitHub Release first so master never points at
          # unpublished /releases/download URLs, then land the manifest.
          gh pr merge "${{ steps.pr.outputs.pr_number }}" --squash --delete-branch
          echo "Auto-merged PR #${{ steps.pr.outputs.pr_number }}"

      - name: Close resolved update issues
        if: github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CATALOG_TAG: ${{ needs.plan.outputs.catalog_tag }}
        run: |
          set -euo pipefail
          TITLE="PHP catalog updates available"
          while IFS= read -r number; do
            [[ -n "${number}" ]] || continue
            gh issue close "${number}" \
              --comment "Closed automatically: catalog \`${CATALOG_TAG}\` shipped the planned update."
            echo "Closed issue #${number}"
          done < <(gh issue list --state open --search "${TITLE} in:title" --json number -q '.[].number')

      - name: Alert on rotation failure
        if: failure() && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CATALOG_TAG: ${{ needs.plan.outputs.catalog_tag }}
        run: |
          set -euo pipefail
          TITLE="Catalog rotation failed"
          BODY="$(mktemp)"
          {
            echo "Automated catalog rotation for \`${CATALOG_TAG}\` failed."
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "The catalog on \`master\` is unchanged; phpvm keeps serving the previous"
            echo "release. Check the failing step in the linked run and re-dispatch with the"
            echo "same inputs once fixed."
          } > "${BODY}"

          EXISTING="$(gh issue list --state open --search "${TITLE} in:title" --json number --limit 1 -q '.[0].number // empty')"
          if [[ -n "${EXISTING}" ]]; then
            gh issue comment "${EXISTING}" --body-file "${BODY}"
            echo "Commented on issue #${EXISTING}"
          else
            gh label create "automation" \
              --description "Automated workflow failure" \
              --color "d73a4a" 2>/dev/null || true
            gh issue create --title "${TITLE}" --body-file "${BODY}" --label "automation"
            echo "Opened failure alert issue"
          fi
